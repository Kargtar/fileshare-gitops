apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fileshare
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kargtar/fileshare-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fileshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
